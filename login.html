<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Login</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <nav class="navbar">

    <div class="logo">
      HIM.
    </div>

    <ul>
      <li><a href="index.html">Portfolio</a></li>
    </ul>

  </nav>

  <section class="hero">

    <div class="project-card" style="max-width:500px; margin:auto;">

      <h2>Secure Login</h2>

      <p style="margin-bottom:20px;">
        Demo Login Interface
      </p>

      <input
        type="text"
        placeholder="Benutzername"
        style="
        width:100%;
        padding:15px;
        margin-bottom:15px;
        border:none;
        border-radius:10px;
        background:#111827;
        color:white;
      ">

      <input
        type="password"
        placeholder="Passwort"
        style="
        width:100%;
        padding:15px;
        margin-bottom:20px;
        border:none;
        border-radius:10px;
        background:#111827;
        color:white;
      ">

      <button class="btn" style="width:100%;">
        Login
      </button>

    </div>

  </section>

</body>

</html>
